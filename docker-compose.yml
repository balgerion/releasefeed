services:
  releasefeed:
    image: git.balgeriada.com/balgerion/releasefeed:latest
    deploy:
      placement:
        constraints:
          - node.role == worker
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:880/"]
      interval: 1m
      timeout: 5s
    ports:
      - "880:880"
    volumes:
      - config:/app/config

volumes:
  config:
    driver_opts:
      type: nfs
      o: nfsvers=4.2,addr=192.168.1.21       
      device: ":/mnt/Balgeriada1/docker/app/releasefeed/config"  