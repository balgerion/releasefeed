<?xml version="1.0" encoding="UTF-8"?>
<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bellGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFA726"/>
      <stop offset="100%" stop-color="#F4511E"/>
    </linearGradient>
    <linearGradient id="badgeGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#42A5F5"/>
      <stop offset="100%" stop-color="#1E88E5"/>
    </linearGradient>
  </defs>

  <!-- Transparent background -->
  <rect width="48" height="48" fill="none"/>

  <!-- Document -->
  <rect x="18" y="10" width="20" height="24" rx="2" ry="2"
        fill="#ECEFF1" stroke="#B0BEC5" stroke-width="1"/>
  <polygon points="34,10 38,14 34,14" fill="#CFD8DC"/>

  <!-- Document lines -->
  <rect x="21" y="16" width="14" height="2" rx="1" fill="#B0BEC5"/>
  <rect x="21" y="20" width="12" height="2" rx="1" fill="#B0BEC5"/>
  <rect x="21" y="24" width="10" height="2" rx="1" fill="#B0BEC5"/>

  <!-- Bell -->
  <path d="M14 28
           C14 20, 24 18, 24 12
           C24 9, 20 9, 20 12
           C20 18, 10 20, 10 28
           Z"
        fill="url(#bellGradient)" stroke="#E64A19" stroke-width="1"/>
  <circle cx="17" cy="30" r="2" fill="#FB8C00"/>

  <!-- Notification badge -->
  <circle cx="36" cy="32" r="6" fill="url(#badgeGradient)"/>
  <path d="M33 32 L37 29 L37 31 L39 31 L39 33 L37 33 L37 35 Z"
        fill="white"/>
</svg>
