on:
  workflow_dispatch:

jobs:
  build:
    runs-on: docker
    container:
      image: docker:latest
      environment:
        DOCKER_HOST: tcp://docker_dind:2375
    steps:
      - name: checkout
        run: git clone https://git.balgeriada.com/balgerion/releasefeed.git .

      - name: build and push
        run: |
          docker build -t git.balgeriada.com/balgerion/releasefeed:latest .
          docker push git.balgeriada.com/balgerion/releasefeed:latest