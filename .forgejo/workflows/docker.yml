on:
  workflow_dispatch:

jobs:
  build:
    runs-on: docker
    container:
      image: docker:24-cli

    env:
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_BUILDKIT: 1

    steps:
      - name: Install deps
        run: |
          apt-get update
          apt-get install -y git

      - name: Clone repo
        run: git clone https://git.balgeriada.com/balgerion/releasefeed.git .

      - name: Setup buildx
        run: |
          docker buildx create --use --name ci-builder || true
          docker buildx inspect --bootstrap

      - name: Build & push
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t git.balgeriada.com/balgerion/releasefeed:latest \
            --push .