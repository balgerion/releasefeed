on:
  workflow_dispatch:

jobs:
  build:
    runs-on: docker

    container:
      image: docker:24-cli

    services:
      docker:
        image: docker:24-dind
        options: --privileged
        env:
          DOCKER_TLS_CERTDIR: ""

    env:
      DOCKER_HOST: tcp://docker:2375   # <-- odnosi się do tego DinD, który runner tworzy

    steps:
      - run: apk add --no-cache git
      - run: git clone https://git.balgeriada.com/balgerion/releasefeed.git .
      - run: |
          docker info
          docker buildx create --use || true
          docker buildx build \
            -t git.balgeriada.com/balgerion/releasefeed:latest \
            --push .