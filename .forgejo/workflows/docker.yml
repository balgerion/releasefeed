on:
  workflow_dispatch:

jobs:
  build:
    runs-on: docker
    container:
      image: docker:29.2.1-cli-alpine3.23

    steps:
      - name: Install deps
        run: apk add --no-cache git bash curl

      - name: Clone repo
        run: git clone https://git.balgeriada.com/balgerion/releasefeed.git .

      - name: Setup Buildx
        run: |
          docker buildx create --use --name ci-builder || true
          docker buildx inspect --bootstrap

      - name: Build & push
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t git.balgeriada.com/balgerion/releasefeed:latest \
            --push .
  