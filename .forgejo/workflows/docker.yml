on:
  workflow_dispatch:
  
jobs:
  build:
    runs-on: docker
    container:
      image: alpine:3.23.3
    services:
      docker:
        image: docker:24-dind
        options: --privileged
        env:
          DOCKER_TLS_CERTDIR: ""
    env:
      DOCKER_HOST: tcp://localhost:2375
    steps:
      - run: apk add --no-cache git bash curl
      - run: git clone https://git.balgeriada.com/balgerion/releasefeed.git .
      - run: |
          docker info
          docker buildx create --use || true
          docker buildx build \
            -t git.balgeriada.com/balgerion/releasefeed:latest \
            --push .