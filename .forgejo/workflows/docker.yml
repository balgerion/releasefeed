jobs:
  build:
    runs-on: docker

    container:
      image: docker:24-cli
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock

    env:
      DOCKER_HOST: unix:///var/run/docker.sock

    steps:
      - run: apk add --no-cache git
      - run: git clone https://git.balgeriada.com/balgerion/releasefeed.git .
      - run: |
          docker info
          docker buildx create --use || true
          docker buildx build \
            -t git.balgeriada.com/balgerion/releasefeed:latest \
            --push .