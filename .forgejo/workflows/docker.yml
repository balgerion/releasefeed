on:
  workflow_dispatch:

jobs:
  build:
    runs-on: docker
    container:
      image: docker:latest
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    steps:
      - name: checkout
        run: git clone https://git.balgeriada.com/balgerion/releasefeed.git .
      - name: login
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login git.balgeriada.com -u "${{ secrets.REGISTRY_USER }}" --password-stdin
      - name: build and push
        run: |
          docker buildx create --use
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t git.balgeriada.com/balgerion/releasefeed:latest \
            --push \
            .